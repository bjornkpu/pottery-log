<!doctype html>
<html lang="no">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pottery Log</title>
  <meta name="theme-color" content="#173a40" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Keramisk oppskriftsbok" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <script src="/config.js"></script>
  <script>
    (() => {
      try {
        const stored = window.localStorage.getItem('theme');
        const mode = (stored === 'light' || stored === 'dark' || stored === 'auto') ? stored : 'auto';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode;
        const root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(resolved);
        if (mode === 'auto') {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', mode);
        }
        root.style.colorScheme = resolved;
      } catch {
        // localStorage can throw in private browsing; fall through to CSS defaults
      }
    })();
  </script>
</head>

<body class="font-sans antialiased [overflow-wrap:anywhere] selection:bg-[rgba(79,184,178,0.24)]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
